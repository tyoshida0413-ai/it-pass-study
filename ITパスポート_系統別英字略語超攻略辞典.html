    const systems = [
      { id: 'strat', name: 'ストラテジ系（経営・戦略・ビジネス・財務）', tagClass: 'tag-strat', badgeClass: 'badge-strat' },
      { id: 'mgmt', name: 'マネジメント系（プロジェクト管理・サービス運用・監査）', tagClass: 'tag-mgmt', badgeClass: 'badge-mgmt' },
      { id: 'tech', name: 'テクノロジ系（ネットワーク・セキュリティ・AI・ハード）', tagClass: 'tag-tech', badgeClass: 'badge-tech' }
    ];

    systems.forEach(sys => {
      if (currentTab !== 'all' && currentTab !== sys.id) return;

      const items = filteredList.filter(t => t.system === sys.id);
      if (items.length === 0) return;

      const sec = document.createElement('section');
      sec.className = 'system-section';
      sec.id = `sec-${sys.id}`;

      let cardsHtml = '';
      items.forEach(t => {
        cardsHtml += `
          <div class="term-card">
            <div>
              <div class="term-top">
                <div class="term-badge ${sys.badgeClass}">${t.abbr}</div>
                <div class="term-category">${t.cat}</div>
              </div>
              <div class="term-full">${t.fullHighlight}</div>
              <div class="term-jp">📌 ${t.jp}</div>
              <div class="hook-box">
                <div class="hook-header">覚え方のツボ</div>
                ${t.hook}
              </div>
            </div>
            ${t.confuse ? `<div class="confuse-tag">${t.confuse}</div>` : ''}
          </div>
        `;
      });

      sec.innerHTML = `
        <div class="system-header">
          <span class="system-tag ${sys.tagClass}">${sys.id.toUpperCase()}</span>
          <h2>${sys.name} (${items.length})</h2>
        </div>
        <div class="terms-grid">${cardsHtml}</div>
      `;

      container.appendChild(sec);
    });

    if (container.children.length === 0) {
      container.innerHTML = `
        <div style="text-align:center; padding:60px 20px; color:#64748b; background:#ffffff; border-radius:16px; border:1px solid #e2e8f0;">
          <div style="font-size:2.5rem; margin-bottom:12px;">🔍</div>
          <div style="font-size:1.1rem; font-weight:700;">一致する略語が見つかりませんでした</div>
          <p style="font-size:0.9rem; margin-top:6px;">別のキーワードやアルファベットで検索してみてください。</p>
        </div>
      `;
    }
  }

  function filterTerms() {
    const q = document.getElementById('search-box').value.trim().toLowerCase();
    const filtered = termData.filter(t => {
      const matchText = (t.abbr + ' ' + t.full + ' ' + t.jp + ' ' + t.cat + ' ' + t.hook).toLowerCase();
      return matchText.includes(q);
    });
    renderTerms(filtered);
  }

  function setTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterTerms();
  }

  function updateCounts() {
    document.getElementById('count-all').textContent = termData.length;
    document.getElementById('count-strat').textContent = termData.filter(t => t.system === 'strat').length;
    document.getElementById('count-mgmt').textContent = termData.filter(t => t.system === 'mgmt').length;
    document.getElementById('count-tech').textContent = termData.filter(t => t.system === 'tech').length;
  }

  // 初期実行
  updateCounts();
  renderTerms(termData);
</script>

</body>
</html>
